<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposal</title>
<style>body{margin:0;min-height:100svh;display:grid;place-items:center;
background:#F4F1EA;color:#6E675C;font-family:Georgia,serif;text-align:center;padding:24px}
p{max-width:40ch;line-height:1.6}</style></head><body><p id="m">Opening&hellip;</p>
<script>
(async()=>{
  const m=document.getElementById('m');
  try{
    const key=(location.hash||'').slice(1).replace(/\.me$/,'');
    if(!key)throw new Error('nokey');
    const r=await fetch('deck.bin');
    if(!r.ok)throw new Error('gone');
    const buf=new Uint8Array(await r.arrayBuffer());
    const salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(key),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct);
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){
    m.textContent=e.message==='gone'
      ?'This link has been retired. Reply to the message that brought you here for a fresh copy.'
      :'This page needs its complete link. Open the exact address you were sent, including everything after the # mark.';
  }
})();
</script></body></html>
